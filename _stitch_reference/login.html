<style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid transparent;
            background-clip: padding-box;
            position: relative;
        }
        
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
        }

        .input-glass {
            background: #020617;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            border-color: #c0c1ff;
            box-shadow: inset 0 0 12px rgba(192, 193, 255, 0.1);
            outline: none;
        }

        .btn-primary-glass {
            background-color: #c0c1ff;
            color: #1000a9;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-primary-glass::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        .btn-primary-glass:hover {
            box-shadow: 0 0 20px rgba(192, 193, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn-secondary-glass {
            background: transparent;
            border: 1px solid #2e3447;
            color: #dce1fb;
            transition: all 0.3s ease;
        }

        .btn-secondary-glass:hover {
            border-color: #c0c1ff;
            box-shadow: 0 0 15px rgba(192, 193, 255, 0.1);
        }

        /* Subtle animated background */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-color: #020617;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(128,131,255,0.3) 0%, rgba(0,0,0,0) 70%);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(79,219,200,0.2) 0%, rgba(0,0,0,0) 70%);
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, -50px) scale(0.9); }
        }
    </style>
</head>
<body class="bg-[#020617] text-on-surface font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Animated Background Mesh -->
<div class="bg-mesh">
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
</div>
<div class="container-max w-full px-md md:px-lg flex justify-center z-10 relative">
<!-- Auth Card -->
<div class="glass-panel w-full max-w-[440px] rounded-xl p-lg flex flex-col gap-lg shadow-2xl relative">
<!-- Logo Header -->
<div class="flex flex-col items-center gap-sm mt-sm">
<img alt="KeystoneOS Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDvs5nn2cZEqFBo4FqNmeIpWneyKs5HsFDvqHxuGYTN6FhJMlS8gOqKF00Vfix2rAHegfsaOwXQBvJ5lk7XID-iAQcKczVj_U38dH0BI3Aj-pF7d8I9Kv_ha2iT9RF1LocZDQZCD2HnyaeCxSsIOQfEWP0dJqCaFhRyOEXIlQvzHwXPYF7fdRivNuFR2MlEU3rWuEioPuE9piqkm0A3VZeU6bZdFqpnKFS3WMwc8Z2iVzrgQQAHc2EeCBypPqY8nv-mqA"/>
<h1 class="font-headline-md text-headline-md text-on-surface mt-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Authenticate to access KeystoneOS</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">mail</span>
<input class="input-glass w-full rounded-lg py-sm pl-xl pr-md text-on-surface font-body-md placeholder:text-outline-variant focus:ring-0" id="email" placeholder="admin@keystoneos.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">lock</span>
<input class="input-glass w-full rounded-lg py-sm pl-xl pr-md text-on-surface font-body-md placeholder:text-outline-variant focus:ring-0" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="btn-primary-glass w-full rounded-lg py-md font-label-md text-label-md uppercase tracking-wider mt-sm" type="submit">
                    Authenticate
                </button>
</form>
<div class="flex items-center gap-md">
<div class="h-[1px] flex-1 bg-surface-variant"></div>
<span class="font-label-md text-label-md text-outline-variant">OR CONTINUE WITH</span>
<div class="h-[1px] flex-1 bg-surface-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="btn-secondary-glass rounded-lg py-sm flex items-center justify-center gap-sm font-label-md text-label-md">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path></svg>
                    Google
                </button>
<button class="btn-secondary-glass rounded-lg py-sm flex items-center justify-center gap-sm font-label-md text-label-md">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path></svg>
                    GitHub
                </button>
</div>
<div class="text-center mt-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Don't have an account? </span>
<a class="font-body-md text-body-md text-primary hover:text-primary-fixed transition-colors font-semibold" href="#">Request Access</a>
</div>
</div>
</div>
</body></html>
